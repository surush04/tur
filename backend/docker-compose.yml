# API and Postgres only. The website, admin panel, and API for the server
# are together in the docker-compose.yml at the repository root.

name: rohi-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rohi
      POSTGRES_PASSWORD: rohi_dev_password
      POSTGRES_DB: rohi_travel
    volumes:
      - rohi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rohi -d rohi_travel"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: postgresql://rohi:rohi_dev_password@postgres:5432/rohi_travel
      JWT_ACCESS_SECRET: dev-only-access-secret-change-before-any-real-deployment
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: 30
      PORT: 3010
      HOST: 0.0.0.0
      UPLOAD_DIR: uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rohi_pg:
  uploads:
